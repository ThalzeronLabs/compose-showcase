name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Runs every unit test (JVM + Robolectric) and compares the screens with docs/screenshots.
      - name: Unit, Room and screenshot tests
        run: ./gradlew :app:verifyRoborazziDebug

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi

      - name: Build the release APK (R8)
        run: ./gradlew :app:assembleRelease

      - name: Report the APK size
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bytes=$(stat -c %s "$apk")
          echo "Release APK: $bytes bytes ($(awk "BEGIN { printf \"%.2f\", $bytes / 1048576 }") MiB)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: shelf-apk
          path: app/build/outputs/apk/release/*.apk
