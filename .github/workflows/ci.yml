name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Every module's unit tests (JVM + Robolectric); the screenshot tests compare against docs/screenshots.
      - name: Unit, Room, WorkManager and screenshot tests
        run: ./gradlew testDebugUnitTest -Proborazzi.test.verify=true

      - name: Upload test reports and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            app/build/outputs/roborazzi

      # The benchmark module only runs on a device, but it must keep compiling against the app.
      - name: Build the release APK (R8) and the benchmark module
        run: ./gradlew :app:assembleRelease :benchmark:assembleBenchmarkRelease

      - name: Report the APK size
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bytes=$(stat -c %s "$apk")
          echo "Release APK: $bytes bytes ($(awk "BEGIN { printf \"%.2f\", $bytes / 1048576 }") MiB)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: shelf-apk
          path: app/build/outputs/apk/release/*.apk
