name: Bug report
description: Something in Shelf does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please check the open issues first in case it is already known.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Search for "dune"
        2. Tap the first result
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shelf version
      description: The release (e.g. v1.0.0) or the commit you built from.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Logcat output or a screenshot, with any personal data removed.
      render: text
