name: Feature or improvement
description: Suggest something that would make Shelf a better app or a better example
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Who needs it, and what do they do today without it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work in the app, and which layer it touches (UI, ViewModel, repository, Room, network).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to open the pull request for this myself
